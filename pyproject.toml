[project]
name = "fastapi-data-access-python"
version = "0.1.0"
description = "FastAPI 数据访问层示例：键集分页、乐观并发控制、事务批量写与错误分类"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
